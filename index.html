<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rusty & Anney · Wedding RSVP</title>
  <!-- Font Awesome for icons (optional, but nice) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* rustic, warm, organic styling */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f7f2e9;  /* warm parchment */
      font-family: 'Georgia', 'Times New Roman', serif;
      color: #3e2e1f;
      scroll-behavior: smooth;
      line-height: 1.5;
    }

    /* ---- main scroll container ---- */
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1.2rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---- top picture / hero ---- */
    .hero {
      width: 100%;
      margin-bottom: 2.5rem;
      border-radius: 32px 32px 16px 16px;
      overflow: hidden;
      box-shadow: 0 20px 30px -10px rgba(60, 40, 20, 0.25);
      border: 6px solid #e6d7c2;
      background: #d9c8b2;
    }

    .hero img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      aspect-ratio: 16 / 9;
      /* warm, slightly faded rustic filter */
      filter: sepia(0.25) contrast(0.95) brightness(1.02);
    }

    /* rustic overlay text on picture (optional name) – but we'll keep names below */
    /* ---- names and title (rustic & anney) ---- */
    .names {
      text-align: center;
      margin-bottom: 1.8rem;
    }

    .names h1 {
      font-size: 3.2rem;
      font-weight: 400;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #4a3724;
      text-shadow: 2px 2px 0 #e9dbcb, 4px 4px 0 rgba(140, 100, 70, 0.1);
      font-family: 'Georgia', 'Times New Roman', serif;
      word-spacing: 0.2em;
    }

    .names h1 span {
      display: inline-block;
      font-weight: 300;
      font-style: italic;
      text-transform: none;
      letter-spacing: 2px;
      color: #8b6b4b;
      margin: 0 0.2rem;
    }

    .names .tagline {
      font-size: 1.3rem;
      margin-top: 0.5rem;
      color: #7a5e44;
      font-style: italic;
      border-top: 1px dashed #c7b29b;
      border-bottom: 1px dashed #c7b29b;
      display: inline-block;
      padding: 0.6rem 2rem;
      letter-spacing: 2px;
      background-color: #f3ebe1;
      border-radius: 50px;
    }

    /* ---- countdown section ---- */
    .countdown-section {
      width: 100%;
      background: #e8dccc;  /* aged wood / linen */
      border-radius: 60px 60px 30px 30px;
      padding: 2.2rem 1.5rem;
      margin: 2rem 0 2.5rem;
      box-shadow: inset 0 0 0 2px #f7f0e6, 0 8px 18px rgba(100, 70, 40, 0.15);
      border: 1px solid #cbb295;
    }

    .countdown-section h2 {
      text-align: center;
      font-weight: 400;
      font-size: 1.8rem;
      letter-spacing: 3px;
      color: #4d3826;
      margin-bottom: 1.8rem;
      text-transform: uppercase;
    }

    .countdown-section h2 i {
      color: #9b7b5e;
      margin-right: 10px;
    }

    .timer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem 2rem;
      align-items: center;
    }

    .timer-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 85px;
      background: #fcf7f0;
      padding: 1rem 0.8rem 0.6rem;
      border-radius: 40px 12px 40px 12px;
      box-shadow: 0 4px 0 #b8a48c, 0 8px 12px rgba(70, 50, 30, 0.1);
      border: 1px solid #dacbbc;
    }

    .timer-number {
      font-size: 3rem;
      font-weight: 600;
      color: #3d2c1b;
      line-height: 1.1;
      font-family: 'Georgia', serif;
      text-shadow: 1px 1px 0 #fff4e8;
      letter-spacing: 2px;
    }

    .timer-label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #8f735b;
      margin-top: 6px;
      font-weight: 400;
    }

    /* ---- place / location ---- */
    .place {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 2rem 0 3rem;
      background: #f1e6da;
      padding: 2rem 1.5rem;
      border-radius: 80px 20px 80px 20px;
      box-shadow: 0 10px 18px -6px rgba(90, 65, 40, 0.2);
      border: 1px solid #dfcdb9;
      position: relative;
    }

    .place::before,
    .place::after {
      content: "✦";
      font-size: 2rem;
      color: #bc9b7b;
      position: absolute;
      opacity: 0.6;
    }

    .place::before {
      top: 10px;
      left: 30px;
    }

    .place::after {
      bottom: 10px;
      right: 30px;
    }

    .place i {
      font-size: 2.5rem;
      color: #927b64;
      margin-bottom: 0.5rem;
    }

    .place h3 {
      font-size: 1.9rem;
      font-weight: 400;
      letter-spacing: 2px;
      color: #4e3825;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .place p {
      font-size: 1.35rem;
      color: #55402c;
      font-style: italic;
      background: #fcf6ee;
      padding: 0.5rem 2rem;
      border-radius: 40px;
      border: 1px dashed #b99e84;
      display: inline-block;
      margin-bottom: 0.25rem;
    }

    .place .address {
      font-size: 1.15rem;
      letter-spacing: 1px;
      color: #715d4a;
      font-style: normal;
    }

    /* ---- rsvp section (interactive, but scroll only) ---- */
    .rsvp-section {
      width: 100%;
      background: #e3d5c4;
      border-radius: 30px 30px 60px 60px;
      padding: 2.5rem 1.5rem 2.8rem;
      margin-top: 1rem;
      text-align: center;
      box-shadow: inset 0 0 0 2px #f7efe6, 0 12px 24px -8px #9b856f;
      border: 1px solid #cbb295;
    }

    .rsvp-section h2 {
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: 4px;
      color: #3d2c1b;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    .rsvp-section h2 i {
      color: #9a7a5c;
      margin: 0 8px;
    }

    .rsvp-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      max-width: 500px;
      margin: 0 auto;
    }

    .rsvp-form input,
    .rsvp-form select,
    .rsvp-form textarea {
      width: 100%;
      padding: 0.9rem 1.2rem;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      background: #fcf7f0;
      border: 1px solid #b8a084;
      border-radius: 40px;
      color: #3e2e1f;
      outline: none;
      transition: 0.2s;
      box-shadow: inset 0 2px 6px rgba(150, 120, 90, 0.1);
    }

    .rsvp-form input:focus,
    .rsvp-form select:focus,
    .rsvp-form textarea:focus {
      border-color: #8d6f54;
      background: #fffcf8;
      box-shadow: 0 0 0 4px rgba(170, 140, 110, 0.2);
    }

    .rsvp-form textarea {
      resize: vertical;
      min-height: 80px;
      border-radius: 20px;
    }

    .rsvp-form button {
      background: #7f6047;
      border: none;
      padding: 1rem 2.8rem;
      font-size: 1.3rem;
      font-family: 'Georgia', serif;
      letter-spacing: 3px;
      color: #fef9f2;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 6px 0 #4f3928, 0 8px 18px rgba(0, 0, 0, 0.15);
      transition: 0.1s linear;
      text-transform: uppercase;
      font-weight: 400;
      margin-top: 0.5rem;
      width: auto;
      min-width: 220px;
    }

    .rsvp-form button:hover {
      background: #926e51;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #4f3928, 0 12px 22px rgba(0, 0, 0, 0.15);
    }

    .rsvp-form button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #4f3928, 0 6px 12px rgba(0, 0, 0, 0.1);
    }

    .rsvp-note {
      margin-top: 1.2rem;
      font-size: 0.95rem;
      color: #6f5a46;
      font-style: italic;
      letter-spacing: 1px;
      border-top: 1px dashed #bba68e;
      padding-top: 1.2rem;
    }

    /* ---- tiny footer ---- */
    .footer-note {
      margin-top: 3.5rem;
      font-size: 0.9rem;
      color: #b09b86;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-top: 1px solid #e1d3c4;
      padding-top: 1.5rem;
      width: 100%;
      text-align: center;
    }

    /* ---- responsive tweaks ---- */
    @media (max-width: 600px) {
      .page {
        padding: 1rem 0.8rem 2.5rem;
      }

      .names h1 {
        font-size: 2.2rem;
        letter-spacing: 4px;
      }

      .timer-number {
        font-size: 2.2rem;
      }

      .timer-block {
        min-width: 70px;
        padding: 0.7rem 0.4rem 0.4rem;
      }

      .place h3 {
        font-size: 1.5rem;
      }

      .place p {
        font-size: 1.1rem;
        padding: 0.4rem 1.2rem;
      }

      .rsvp-section h2 {
        font-size: 1.7rem;
      }

      .hero {
        border-width: 4px;
      }
    }

    @media (max-width: 400px) {
      .timer {
        gap: 0.8rem;
      }

      .timer-block {
        min-width: 60px;
      }

      .timer-number {
        font-size: 1.8rem;
      }

      .timer-label {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- TOP PICTURE (wedding themed) -->
    <div class="hero">
      <!-- rustic wedding image from placeholder (unsplash-like source) -->
      <img 
        src="https://images.pexels.com/photos/169198/pexels-photo-169198.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" 
        alt="Rustic wedding table setting with flowers and candles"
      >
    </div>

    <!-- WEDDING NAMES: RUSTY & ANNEY -->
    <div class="names">
      <h1>Rusty <span>&</span> Anney</h1>
      <div class="tagline">are getting married</div>
    </div>

    <!-- COUNTDOWN SECTION -->
    <div class="countdown-section">
      <h2><i class="fas fa-hourglass-half"></i> Counting down <i class="fas fa-hourglass-half"></i></h2>
      <div class="timer" id="countdown-timer">
        <div class="timer-block">
          <span class="timer-number" id="days">00</span>
          <span class="timer-label">Days</span>
        </div>
        <div class="timer-block">
          <span class="timer-number" id="hours">00</span>
          <span class="timer-label">Hours</span>
        </div>
        <div class="timer-block">
          <span class="timer-number" id="minutes">00</span>
          <span class="timer-label">Minutes</span>
        </div>
        <div class="timer-block">
          <span class="timer-number" id="seconds">00</span>
          <span class="timer-label">Seconds</span>
        </div>
      </div>
    </div>

    <!-- PLACE / VENUE -->
    <div class="place">
      <i class="fas fa-map-pin"></i>
      <h3>The Old Barn</h3>
      <p>⛪ 1234 Rustic Lane, Willow Creek</p>
      <span class="address">Asheville, North Carolina · June 14, 2026 · 4:00 PM</span>
    </div>

    <!-- RSVP SECTION (scrolling, no actual submission — just visual) -->
    <div class="rsvp-section">
      <h2><i class="fas fa-envelope"></i> RSVP <i class="fas fa-envelope"></i></h2>
      <form class="rsvp-form" onsubmit="event.preventDefault(); alert('🌿 Thank you! This is a demo RSVP — we’d love to have you. (Rusty & Anney)');">
        <input type="text" placeholder="Your full name" required>
        <input type="email" placeholder="Email address" required>
        <select required>
          <option value="" disabled selected>Will you attend?</option>
          <option value="yes">Joyfully accepts</option>
          <option value="no">Regretfully declines</option>
        </select>
        <textarea placeholder="Any dietary notes or a rustic message..."></textarea>
        <button type="submit">Send RSVP</button>
      </form>
      <div class="rsvp-note">Kindly respond by May 1, 2026</div>
    </div>

    <!-- small footer -->
    <div class="footer-note">Rusty &amp; Anney · #rusticwedding</div>
  </div>

  <!-- COUNTDOWN SCRIPT (target: June 14, 2026 16:00) -->
  <script>
    (function() {
      // Set wedding date: June 14, 2026 at 4:00 PM (local time)
      const weddingDate = new Date(2026, 5, 14, 16, 0, 0); // month index 5 = June

      function updateCountdown() {
        const now = new Date();
        const diff = weddingDate - now;

        if (diff <= 0) {
          // if the date has passed, show zeros
          document.getElementById('days').textContent = '00';
          document.getElementById('hours').textContent = '00';
          document.getElementById('minutes').textContent = '00';
          document.getElementById('seconds').textContent = '00';
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('days').textContent = String(days).padStart(2, '0');
        document.getElementById('hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
        document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
      }

      // initial call
      updateCountdown();
      // update every second
      setInterval(updateCountdown, 1000);
    })();
  </script>
</body>
</html>
